[package]
name = "backurau-server"
version = "0.1.0"
description = "Backurau service: the shared engine behind a token-authenticated web API, plus the web UI"
edition = "2021"

[dependencies]
backurau-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
