[package]
name = "backurau"
version = "1.0.0"
description = "Backurau — compare, synchronize and back up folders"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backurau-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
